<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <clipPath id="canvas">
      <rect x="0" y="0" width="96" height="96" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <!-- Body / shoulders (dark brown fur, narrow - just a small neck peek) -->
    <path d="M 36 50
             C 36 47 38 45 40 45
             L 56 45
             C 58 45 60 47 60 50
             L 60 58
             L 36 58
             Z"
          fill="#3e2417" stroke="#1c0f08" stroke-width="1.5"/>

    <!-- Trousers (khaki, full length) -->
    <path d="M 30 78 L 66 78 L 66 94 L 53 94 L 51 84 L 45 84 L 43 94 L 30 94 Z"
          fill="#c2ab74" stroke="#1c0f08" stroke-width="1.5"/>
    <line x1="48" y1="78" x2="48" y2="94" stroke="#a68f5c" stroke-width="1"/>
    <!-- Shoes -->
    <rect x="29" y="92" width="16" height="4" rx="1.5" fill="#2a1a10"/>
    <rect x="51" y="92" width="16" height="4" rx="1.5" fill="#2a1a10"/>

    <!-- Shirt (green polo) -->
    <path d="M 27 55
             C 27 50 32 47 36 46
             L 42 52
             L 48 57
             L 54 52
             L 60 46
             C 64 47 69 50 69 55
             L 69 80
             L 27 80
             Z"
          fill="#2f4d3a" stroke="#1c0f08" stroke-width="1.5"/>
    <!-- Sleeves (plain, no cuff trim, subtle hem shadow) -->
    <path d="M 25 58 C 23 60 22 64 23 69 L 29 69 C 28 65 28 60 29 57 Z" fill="#2f4d3a" stroke="#1c0f08" stroke-width="1.3"/>
    <path d="M 71 58 C 73 60 74 64 73 69 L 67 69 C 68 65 68 60 67 57 Z" fill="#2f4d3a" stroke="#1c0f08" stroke-width="1.3"/>
    <path d="M 23 67 Q 26 69 29 67" stroke="#20372a" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M 73 67 Q 70 69 67 67" stroke="#20372a" stroke-width="1" fill="none" stroke-linecap="round"/>

    <!-- Placket (white strip behind buttons) -->
    <path d="M 45.5 55 L 50.5 55 L 51 71 L 45 71 Z" fill="#f4ecdd" stroke="#1c0f08" stroke-width="1"/>

    <!-- Collar (crisp spread collar, sharp points) -->
    <path d="M 35 45.5 L 43 46 L 48.5 55.5 L 44.5 61 L 34.5 51 Z" fill="#f4ecdd" stroke="#1c0f08" stroke-width="1.2"/>
    <path d="M 61 45.5 L 53 46 L 47.5 55.5 L 51.5 61 L 61.5 51 Z" fill="#f4ecdd" stroke="#1c0f08" stroke-width="1.2"/>

    <!-- Buttons -->
    <circle cx="48" cy="61" r="1.2" fill="#1c0f08"/>
    <circle cx="48.2" cy="66.5" r="1.2" fill="#1c0f08"/>

    <!-- Pine badge (canopy + small trunk) -->
    <path d="M 60.5 61.5 L 62.5 65.5 L 61 65.5 L 63 69 L 58 69 L 60 65.5 L 58.5 65.5 Z" fill="#f4ecdd"/>
    <rect x="59.5" y="69" width="1" height="1.6" fill="#f4ecdd"/>

    <!-- Belt -->
    <rect x="27" y="75" width="42" height="4" fill="#8a5a2b" stroke="#1c0f08" stroke-width="1"/>
    <rect x="44.5" y="74.5" width="7" height="5" rx="1" fill="#e8b84b" stroke="#1c0f08" stroke-width="1"/>

    <!-- Ears -->
    <circle cx="30" cy="30" r="7" fill="#4a2e1c" stroke="#1c0f08" stroke-width="1.5"/>
    <circle cx="66" cy="30" r="7" fill="#4a2e1c" stroke="#1c0f08" stroke-width="1.5"/>

    <!-- Head -->
    <circle cx="48" cy="35" r="24" fill="#4a2e1c" stroke="#1c0f08" stroke-width="1.5"/>

    <!-- Muzzle -->
    <ellipse cx="48" cy="43" rx="13" ry="10" fill="#c99a6e" stroke="#3e2417" stroke-width="1"/>

    <!-- Eyebrows -->
    <path d="M 36 28 Q 40 25 44 28" stroke="#2a190f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 52 28 Q 56 25 60 28" stroke="#2a190f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="40" cy="33" r="3.2" fill="#1c0f08"/>
    <circle cx="56" cy="33" r="3.2" fill="#1c0f08"/>
    <circle cx="39" cy="32" r="0.9" fill="#ffffff"/>
    <circle cx="55" cy="32" r="0.9" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 45 40 Q 48 38 51 40 Q 51 43 48 44 Q 45 43 45 40 Z" fill="#1c0f08"/>

    <!-- Mouth (happy smile) -->
    <path d="M 48 44 L 48 46.5 M 48 46.5 Q 42 47 40.5 44.5 M 48 46.5 Q 54 47 55.5 44.5"
          stroke="#1c0f08" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Hat brim (panama, flat & wide) -->
    <ellipse cx="48" cy="24" rx="29" ry="7" fill="#e9dcbb" stroke="#1c0f08" stroke-width="1.5"/>
    <ellipse cx="48" cy="23" rx="29" ry="6.5" fill="#f2ead9" stroke="#1c0f08" stroke-width="1"/>
    <!-- Hat crown (dome with soft twin-peak top, like reference) -->
    <path d="M 33 22
             C 33 11 38 5 43 5
             C 45 5 46.5 7 48 7
             C 49.5 7 51 5 53 5
             C 58 5 63 11 63 22
             Z"
          fill="#eee3cd" stroke="#1c0f08" stroke-width="1.5"/>
    <!-- Hat band (brown ribbon at base of crown) -->
    <path d="M 33.5 19 C 39 21.5 57 21.5 62.5 19 L 62.5 23 C 57 25.5 39 25.5 33.5 23 Z" fill="#8a5a2b" stroke="#1c0f08" stroke-width="1"/>
  </g>
</svg>
